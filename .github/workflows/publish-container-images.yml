name: Publish public container images

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["toolchain-*"]
    paths:
      - "docker/**"
      - "eval/evalsys/requirements.txt"
      - ".github/workflows/publish-container-images.yml"

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-container-images
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: false
          sparse-checkout: |
            docker
            eval/evalsys/requirements.txt
          sparse-checkout-cone-mode: false

      - name: Build redistributable toolchain image
        run: ./docker/build.sh godot

      - name: Check installed tools and Godot rendering
        run: ./docker/smoke.sh godot

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USER" --password-stdin

      - name: Publish images
        env:
          IMAGE_REPOSITORY: ghcr.io/charly-chan/swe-game
        run: |
          revision="${GITHUB_SHA:0:12}"
          tag=godot-4.5.1
          docker tag "gamebench-agent:$tag" "$IMAGE_REPOSITORY:$tag-$revision"
          docker tag "gamebench-agent:$tag" "$IMAGE_REPOSITORY:$tag"
          docker push "$IMAGE_REPOSITORY:$tag-$revision"
          docker push "$IMAGE_REPOSITORY:$tag"
          printf -- '- `%s:%s` (revision tag: `%s-%s`)\n' "$IMAGE_REPOSITORY" "$tag" "$tag" "$revision" >> "$GITHUB_STEP_SUMMARY"

      - name: Log out of GHCR
        if: always()
        run: docker logout ghcr.io
