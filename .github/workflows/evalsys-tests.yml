name: evalsys tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: evalsys-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTHONPATH: .
      GODOT_BIN: /opt/godot451-bin/godot
    defaults:
      run:
        working-directory: eval/evalsys
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          lfs: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            eval/evalsys/requirements.txt
            eval/evalsys/requirements-harbor.txt

      - name: Prepare Linux test environment
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu-core util-linux curl unzip \
            xvfb xauth ffmpeg libgl1 libgl1-mesa-dri libegl1 libgbm1 \
            libx11-6 libxcursor1 libxinerama1 libxrandr2 libxi6 libxkbcommon0 \
            libasound2t64 libpulse0 libfontconfig1 libdbus-1-3 libudev1
          # The agent sandbox mounts private filesystems on these paths.
          sudo install -d -o "$(id -u)" -g "$(id -g)" /workspace /tmp/swe-game
          mkdir -p "$RUNNER_TEMP/swe-game-taskgen" "$RUNNER_TEMP/swe-game-gates"
          printf 'GB_SCRATCH_ROOT=%s\n' "$RUNNER_TEMP/swe-game-taskgen" >> "$GITHUB_ENV"
          printf 'GB_GATES_SCRATCH=%s\n' "$RUNNER_TEMP/swe-game-gates" >> "$GITHUB_ENV"
          # Ubuntu 24.04 restricts unprivileged user namespaces by default.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          unshare --user --map-root-user --mount --pid --fork --mount-proc true

      - name: Restore reference projects from the pinned dataset
        run: python ../../scripts/fetch_reference_data.py --game all

      - name: Check repository release hygiene
        run: python ../../scripts/check_release.py --with-data

      - name: Install Godot 4.5.1
        run: |
          curl --retry 3 --connect-timeout 30 -fsSL \
            https://github.com/godotengine/godot/releases/download/4.5.1-stable/Godot_v4.5.1-stable_linux.x86_64.zip \
            -o "$RUNNER_TEMP/godot.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          sudo install -D -m 0755 "$RUNNER_TEMP/godot/Godot_v4.5.1-stable_linux.x86_64" "$GODOT_BIN"
          sudo ln -s "$GODOT_BIN" /usr/local/bin/godot
          "$GODOT_BIN" --version

      - name: Install evaluator and Harbor dependencies
        run: python -m pip install -r requirements-harbor.txt

      - name: Run evalsys pytest suite
        run: python -m pytest tests/ -q -ra --junitxml=pytest-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: evalsys-pytest-results
          path: eval/evalsys/pytest-results.xml
          if-no-files-found: warn
